name: Dependency review
# Requires Dependency graph enabled in repository Settings > Advanced Security.
# pull_request with a read-only token works for forks and Dependabot; do not
# switch to pull_request_target or grant write access to run untrusted PR code.
on: [pull_request]
permissions:
  contents: read
jobs:
  dependency-review:
    # Private operational repositories may lack dependency-review entitlement.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
          # MPL-2.0 rationale and redistribution requirements: docs/THIRD-PARTY.md.
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, Unlicense, BlueOak-1.0.0, MPL-2.0
          # Exact, reviewed sharp binary licenses and redistribution obligations:
          # docs/THIRD-PARTY.md. Vulnerability checks still apply to these packages.
          allow-dependencies-licenses: >-
            pkg:npm/@img/sharp-libvips-darwin-arm64@1.3.4,
            pkg:npm/@img/sharp-libvips-darwin-x64@1.3.4,
            pkg:npm/@img/sharp-libvips-linux-arm@1.3.4,
            pkg:npm/@img/sharp-libvips-linux-arm64@1.3.4,
            pkg:npm/@img/sharp-libvips-linux-ppc64@1.3.4,
            pkg:npm/@img/sharp-libvips-linux-riscv64@1.3.4,
            pkg:npm/@img/sharp-libvips-linux-s390x@1.3.4,
            pkg:npm/@img/sharp-libvips-linux-x64@1.3.4,
            pkg:npm/@img/sharp-libvips-linuxmusl-arm64@1.3.4,
            pkg:npm/@img/sharp-libvips-linuxmusl-x64@1.3.4,
            pkg:npm/@img/sharp-wasm32@0.35.5,
            pkg:npm/@img/sharp-win32-arm64@0.35.5,
            pkg:npm/@img/sharp-win32-ia32@0.35.5,
            pkg:npm/@img/sharp-win32-x64@0.35.5
