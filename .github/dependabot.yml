version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep the reviewed compatibility drafts pending a runtime/linter decision.
    ignore:
      # Deferred compiler API migration: public-source issue #54.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Known-length HTTP 421 replay regression: public-source issue #55.
      - dependency-name: "@cloudflare/vite-plugin"
        versions: ["1.62.2"]
      - dependency-name: wrangler
        versions: ["4.144.0"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react-family:
        patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - react
          - react-dom
          - react-server-dom-webpack
          - "@types/react"
          - "@types/react-dom"
          - "@types/node"
          - eslint
          - eslint-config-next
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
